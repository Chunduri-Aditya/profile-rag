- q: What is the AI Health Journal?
  a: A local RAG journal with a measured safety floor, private by default, with retrieval Recall@3 of 0.968 and a crisis floor at sensitivity 1.000.
  source: project/ai-health-journal/overview
- q: What is MetaLearnML?
  a: A meta learned AutoML ranker measured against its own baselines. The meta learner ranks better than random (median Spearman 0.57 vs 0.02) but the measured evaluation speedup was 0.0 percent, and that null result is published.
  source: project/metalearnml/overview
- q: What is Sourcewarden?
  a: Security gated n8n workflow orchestration, a chatbot that helps build n8n workflows and only mutates a live instance behind a signed approval gate, with 71 offline tests.
  source: project/sourcewarden/overview
- q: What is jarvis?
  a: Turn scoped containment for coding agents, a Claude Code hook layer that taints a turn after hostile content is read and fails closed when the screener cannot run, with 124 tests.
  source: project/jarvis/overview
