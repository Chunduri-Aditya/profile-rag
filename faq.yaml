- q: What is the Personal Digital Twin?
  a: Persistent agent memory behind a fail closed privacy boundary, selecting five source tagged chunks per turn from a profile, a redacted interview transcript and expert reflections, with leak and redaction gates that refuse to build a bad index.
  source: project/twin/overview
- q: What is AI RemixMate?
