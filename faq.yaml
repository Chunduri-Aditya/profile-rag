- q: What is Agent Shield?
  a: Agent Shield is an adversarial evaluation framework plus local runtime perimeter that stress tests LLM agents across prompt injection, MCP tool poisoning, RAG memory poisoning, and behavioral drift, built on UK AISI's Inspect AI harness with every threat mapped to OWASP and MITRE ATLAS.
  source: project/agent-shield/overview
- q: What is Transparency Rate?
  a: Transparency Rate is whether an agent flags an attack to its operator, introduced in Agent Shield as a third axis alongside attack success rate and task utility.
  source: project/agent-shield/evidence/1
- q: What are Aditya's publications?
  a: Beyond Attack Success Rate, Measuring Operator-Facing Transparency in LLM Agent Security (sole authored preprint, Zenodo 2026, doi 10.5281/zenodo.20789431), and Wind Power Analysis Using Machine Learning in Wind Turbines (IJRASET, Vol 11, Aug 2023).
  source: publication/Beyond Attack Success Rate
